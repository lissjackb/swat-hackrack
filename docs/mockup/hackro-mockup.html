<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackro — Swarthmore demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090A;--s1:#141618;--s2:#1C1F22;--line:#24282C;--tx:#F5F6F7;--t2:#B4BAC1;--t3:#8C939B;--garnet:#A8233A;--garnet-t:#E35D73;--lime:#B8F135;--amber:#FFB020;--orange:#FF9432;--blue:#4DA3FF;--violet:#9B8CFF;--green:#34D399;--red:#FF5A5A;--fat:#C9CED4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:var(--tx)}
:focus-visible{outline:2px solid var(--garnet-t);outline-offset:2px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){body{background:#050506}#app{border-left:1px solid #121416;border-right:1px solid #121416}}
.bd{padding:16px 20px 40px;display:flex;flex-direction:column;gap:32px;flex:1;animation:fade .25s ease}
.g{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.sb{justify-content:space-between}
.lbl{font:600 13px/1 'Barlow Condensed',sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:var(--t2)}
.h1{margin:0;font:700 34px/1.04 'Barlow Condensed',sans-serif;text-wrap:balance}
.sub{margin:0;color:var(--t2);font-size:15px;line-height:1.45;text-wrap:pretty}
.n{font-family:'Barlow Condensed',sans-serif;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.u{font:500 13px Inter,sans-serif;color:var(--t2)}
.t2{color:var(--t2)}.t3{color:var(--t3)}.lime{color:var(--lime)}
.card{background:var(--s1);border-radius:24px;padding:16px}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.tr{height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.fl{height:100%;border-radius:999px;transition:width .5s ease}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile{width:40px;height:40px;border-radius:8px;background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center;flex:none}
.cta{height:56px;border-radius:16px;background:var(--garnet);color:#fff;font:700 16px Inter,sans-serif;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.cta:hover{filter:brightness(1.08)}
.cta:disabled{background:var(--s2);color:var(--t3);filter:none}
.cta.inr{border-radius:8px;height:52px}
.ghost{height:52px;border-radius:16px;color:var(--tx);font:600 15px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.ghost.fill{background:var(--s1)}
.card .ghost.fill{background:var(--s2);border-radius:8px}
.ib{width:44px;height:44px;border-radius:999px;background:var(--s1);display:flex;align-items:center;justify-content:center;flex:none}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--s1);color:var(--tx);font:600 13px Inter,sans-serif;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--tx);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scrollx{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.opt{width:100%;text-align:left;background:var(--s1);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:inset 0 0 0 0 var(--lime);transition:box-shadow .15s}
.opt.on{box-shadow:inset 0 0 0 2px var(--lime)}
.radio{width:22px;height:22px;border-radius:999px;box-shadow:inset 0 0 0 1.5px #5A6068;flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .radio{box-shadow:inset 0 0 0 7px var(--lime)}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font:600 13px/1 'Barlow Condensed',sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:var(--t2)}
.inp{height:52px;border-radius:16px;background:var(--s1);border:0;padding:0 16px;font:500 16px Inter,sans-serif;width:100%;outline:none}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--t3)}
.inp::placeholder{color:var(--t3)}
.stepper{display:flex;align-items:center;justify-content:space-between;height:52px;border-radius:16px;background:var(--s1);padding:0 6px}
.stepper button{width:40px;height:40px;border-radius:999px;background:var(--s2);display:flex;align-items:center;justify-content:center}
.seg{display:grid;gap:4px;background:var(--s1);border-radius:16px;padding:4px}
.seg button{height:44px;border-radius:12px;font:600 14px Inter,sans-serif;color:var(--t2)}
.seg button.on{background:var(--s2);color:var(--tx)}
.tog{width:48px;height:28px;border-radius:999px;background:#2C3036;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:#fff;transition:transform .15s}
.tog.on{background:var(--lime)}
.tog.on::after{transform:translateX(20px);background:#08090A}
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 6px calc(14px + env(safe-area-inset-bottom));background:rgba(8,9,10,.94);backdrop-filter:blur(12px);border-top:1px solid var(--s2);z-index:5}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 2px;font:600 11px Inter,sans-serif;color:var(--t3)}
.tab .i{width:22px;height:22px}
.tab.on{color:var(--tx)}
.tab.on::before{content:"";position:absolute;top:-9px;width:28px;height:2px;border-radius:2px;background:var(--garnet-t)}
.sk{border-radius:8px;background:linear-gradient(90deg,#1F2226 0%,#2C3036 50%,#1F2226 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.spin{animation:spin .9s linear infinite}
.meal{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 12px;border-radius:16px;width:100%;text-align:left}
.mt{font:600 16px/1 'Barlow Condensed',sans-serif;color:var(--t2);padding-top:2px}
.prog{display:grid;gap:6px}
.prog>span{height:3px;border-radius:2px;background:var(--s2)}
.prog>span.on{background:var(--tx)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:430px;background:var(--s1);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;animation:up .25s ease;max-height:92vh;overflow:auto}
.sheet .in{background:var(--s2);border-radius:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);font:600 14px Inter,sans-serif;padding:12px 16px;border-radius:14px;z-index:30;display:flex;gap:8px;align-items:center;animation:up .2s;max-width:calc(100% - 40px)}
.warn{color:var(--red)}
.ok{color:var(--green)}
.check{display:flex;align-items:center;gap:12px;font-size:15px}
.check .dot{width:22px;height:22px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center}
.fadein{animation:up .35s ease both}
.note{font-size:12px;color:var(--t3);line-height:1.5}
.brand{font:700 44px/1 'Barlow Condensed',sans-serif;letter-spacing:6px}
</style>
</head>

function swapCands(mealId, key){
 const x = plan(mealById(mealId).day).find(y => y.m.id === mealId);
 const pp = x.parts.find(q => (q.from || q.it.name) === key); const role = pp.it.nut[6];
 const grp = ['P','X'].includes(role) ? ['P','X'] : ['V','F'].includes(role) ? ['V','F'] : ['C','S'].includes(role) ? ['C'] : [role];
 const inMeal = new Set(x.parts.map(q => q.it.name)); const k0 = pp.it.nut[0]*pp.m, p0 = pp.it.nut[1]*pp.m;
 const out = itemsFor(mealId).filter(it => fits(it) && grp.includes(it.nut[6]) && !inMeal.has(it.name)).map(it => {
  let best = null;
  for (const m of multsFor(it, [0.5,1,1.5,2,2.5,3])) { const k = it.nut[0]*m, p = it.nut[1]*m; const e = Math.abs(k-k0)/Math.max(k0,50) + 1.2*Math.abs(p-p0)/Math.max(p0,8); if (!best || e < best.e) best = {it, m, k, p, e}; }
  return best;
 }).filter(Boolean).sort((a, b) => a.e - b.e).slice(0, 6);
 return {pp, k0, p0, out, x};

/* ---- Body-goal plan builder: rate capped at 1% of body weight a week (0.5% for cuts when BMI < 20) ---- */
const TODAY = new Date(2026, 10, 14);
const fmtDate = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric', year: d.getFullYear() !== 2026 ? 'numeric' : undefined});
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function goalPlan(g, p = S.p){
 if (!g || !(+g.target > 0) || !g.date) return null;
 const cur = +p.lb, tgt = +g.target, diff = tgt - cur; if (Math.abs(diff) < 0.5) return {same: true, cur, tgt};
 const parts = String(g.date).split('-').map(Number); const want = new Date(parts[0], parts[1]-1, parts[2]);
 const weeksWanted = Math.max(1, Math.round((want - TODAY) / (7 * 864e5)));
 const kg = cur * 0.4536, mtr = (p.ft*12 + (+p.inch)) * 0.0254, bmi = kg / (mtr*mtr);
 const lowBmiCut = diff < 0 && bmi < 20; const capPct = lowBmiCut ? 0.005 : 0.01; const cap = cur * capPct;
 const rateWanted = Math.abs(diff) / weeksWanted; const extended = rateWanted > cap + 1e-9;
 const weeks = extended ? Math.ceil(Math.abs(diff) / cap) : weeksWanted; const rate = Math.abs(diff) / weeks;
 const end = new Date(TODAY.getTime() + weeks * 7 * 864e5);
 const every = Math.max(1, Math.ceil(weeks / 8)); const ms = [];
 for (let w = every; w < weeks; w += every) ms.push({w, date: new Date(TODAY.getTime() + w*7*864e5), lb: cur + diff * w / weeks});
 ms.push({w: weeks, date: end, lb: tgt});
 const dir = diff > 0 ? 'gain' : 'loss';
 const why = extended ? `${fmtDate(want)} would take ${rateWanted.toFixed(1)} lb a week. We cap ${dir} at ${(capPct*100).toFixed(capPct < 0.01 ? 1 : 0)}% of body weight (${cap.toFixed(1)} lb a week)${lowBmiCut ? ' because your BMI is under 20' : ''}, so the plan ends ${fmtDate(end)} instead.` : '';
 const mismatch = (p.goal === 'cut' && diff > 0) ? 'Your goal is a cut, but this target is a gain.' : (p.goal === 'build' && diff < 0) ? `Your goal is a ${GOALS[p.goal].label.toLowerCase()}, but this target is a loss.` : '';
 return {cur, tgt, diff, weeks, weeksWanted, want, extended, rate, cap, capPct, bmi, end, ms, why, mismatch, dir};
}
function goalPreview(g){
 const gp = goalPlan(g);
 if (!gp) return `<p class="note" style="margin:0">Enter a target weight and date to see the plan.</p>`;
 if (gp.same) return `<p class="note" style="margin:0">That's your current weight. Pick a different target, or use Maintain.</p>`;
 return `<div class="g" style="gap:12px">
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
   <div><div class="n" style="font-size:26px">${gp.diff > 0 ? '+' : '−'}${Math.abs(gp.diff).toFixed(1)}</div><div class="lbl" style="margin-top:6px;font-size:12px">lb total</div></div>
   <div><div class="n" style="font-size:26px">${gp.rate.toFixed(2)}</div><div class="lbl" style="margin-top:6px;font-size:12px">lb / week</div></div>

function goalText(g, model){

 if (/rice|pasta|cavatappi|potato|fries|bread|\bbun|waffle|pancake|oatmeal|grits|noodle|quinoa|tortilla|pita|bagel|hashbrown|tots|biscuit|cereal|granola|chickpea|cavatappi/.test(n)) return 'C';
 if (/yogurt|\beggs?\b|cheese|edamame|cottage/.test(n)) return 'D';
 if (/salad|lettuce|broccoli|green bean|asparagus|carrot|cucumber|tomato|cabbage|eggplant|spinach|kale|vegetable|zucchini|pepper|romaine|greens/.test(n)) return 'V';
 if (/fruit|melon|berry|berries|grape|apple|orange|banana|blueberr|grapefruit|applesauce|mango|craisin|raisin/.test(n)) return 'F';
 if (/sauce|dressing|syrup|honey|butter|jam|compote|salsa|chimichu|ragout|\bcream\b|gravy|aioli|mayo|seasoning|flakes|sugar|almond|coconut|scallion|bits|dip/.test(n)) return 'K';
 return 'X';
}
function guessFlags(name, diet){
 const d = (diet || []).map(x => String(x).toLowerCase());
 if (d.includes('vegan') || d.includes('vegetarian')) return '';
 const n = name.toLowerCase();
 if (/shrimp|salmon|tuna|\bfish\b|crab|lobster|shellfish/.test(n)) return 'f';
 if (/chicken|beef|steak|pork|sausage|bacon|turkey|\bham\b|lamb|\bmeat\b|wings|gyro|shawarma|pepperoni/.test(n)) return 'm';
 return '';
}
async function jget(url){ const r = await fetch(url); if (!r.ok) throw new Error(url + ' -> ' + r.status); return r.json(); }
/* The profile the app writes against: the one onboarding created, else the seeded test user. */
function currentProfileId(){ return (typeof S !== 'undefined' && S && S.profileId) || API.profileId; }
/* Persist onboarding answers as a real Profile row; key later calls off its id. */
async function createProfile(){
 try {
  const p = S.p;
  const heightCm = Math.round(((+p.ft || 0) * 12 + (+p.inch || 0)) * 2.54);
  const weightKg = +((+p.lb || 0) * 0.4536).toFixed(1);
  const days = +p.days || 0;
  const activityLevel = days <= 1 ? 'light' : days <= 3 ? 'moderate' : days <= 5 ? 'active' : 'veryActive';
  const input = { name: p.name || 'Student', goal: p.goal, heightCm, weightKg, age: +p.age || 20, sex: p.sex, activityLevel, restrictions: p.restrictions || [] };
  const res = await fetch('/api/profile', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(input) });
  if (res.ok) { const prof = await res.json(); S.profileId = prof.id; save(); console.log('[Hackro] profile created in DB:', prof.id); }
  else console.warn('[Hackro] /api/profile rejected:', res.status, await res.text());
 } catch (e) { console.warn('[Hackro] profile create failed (keeping test user):', e.message); }
}
/* Send the user through the REAL WHOOP OAuth consent for the current profile.
   WHOOP returns them to /?whoop=connected, handled by handleWhoopReturn(). */
function connectWhoopLive(){ save(); window.location.href = '/api/whoop/connect?profileId=' + encodeURIComponent(currentProfileId()); }
/* On return from OAuth, pull the connected account's real recovery/strain. */
async function handleWhoopReturn(){
 if (new URL(location.href).searchParams.get('whoop') !== 'connected') return;
 history.replaceState({}, '', '/'); // so a refresh doesn't re-trigger
 try {
  const w = await jget(`/api/whoop?profileId=${encodeURIComponent(currentProfileId())}&mock=false`);
  if (typeof w.recovery === 'number') { WEAR.recovery = Math.round(w.recovery); WEAR.strain = Math.round(w.strain * 10) / 10; }
  S.device = 'whoop';
  if (!(S.perms && S.perms.recovery)) S.perms = ALLPERMS();
  if (['login', 'ob', 'gen', 'connect', 'reveal'].includes(S.view)) { S.view = 'app'; S.tab = 'today'; }
  save();
  toast(w.mock ? 'Whoop connected · last synced data' : `Whoop live · recovery ${WEAR.recovery}%, strain ${WEAR.strain}`);
  render(true);
  console.log('[Hackro] WHOOP', w.mock ? '(fell back to last known)' : 'LIVE', w);
 } catch (e) { console.warn('[Hackro] whoop return fetch failed:', e.message); }
}
async function bootstrapRealData(){
 try {
  const results = await Promise.all(Object.entries(API.map).map(([id, q]) =>
   jget(`/api/menu?date=${q.date}&meal=${q.meal}`).then(d => [id, d.items || []])));
  let loaded = 0;
  for (const [id, items] of results) {
   if (!items.length) continue; // keep the built-in menu for this slot
   const byStation = {}; API.idByName[id] = {};
   for (const it of items) {
    const existing = NUT[it.name]; const hasReal = it.calories > 0; let nut;
    if (existing) {
     nut = existing.slice();
     if (hasReal) { nut[0] = Math.round(it.calories); nut[1] = Math.round(it.protein); nut[2] = Math.round(it.carbs); nut[3] = Math.round(it.fat); }
    } else if (hasReal) {
     nut = [Math.round(it.calories), Math.round(it.protein), Math.round(it.carbs), Math.round(it.fat), 1, 'serving', guessRole(it.name), guessFlags(it.name, it.dietary)];
    } else {
     continue; // no macros and no estimate: the solver would drop it anyway
    }
    NUT[it.name] = nut; API.idByName[id][it.name] = it.id;
    const tags = [...(it.dietary || []), ...(it.allergens || [])].map(l => `::${String(l).toLowerCase()}::`).join(' ');
    const piece = tags ? `${it.name} ${tags}` : it.name;
    const st = it.station || 'Menu';
    byStation[st] = byStation[st] ? byStation[st] + ', ' + piece : piece;
    loaded++;
   }
   if (Object.keys(byStation).length) MENU[id] = byStation;
  }
  if (!loaded) return; // nothing usable; keep the built-in demo menu
  for (const k in CACHE) delete CACHE[k];
  for (const k in RANK) delete RANK[k];
  for (const k in BASE) delete BASE[k];
  console.log(`[Hackro] Loaded ${loaded} real menu items from /api/menu (demo-profile)`);
  render(true);
 } catch (e) {
  console.warn('[Hackro] API unavailable — using built-in demo data:', e.message);
 }
}
/* Persist an "I ate this" to the DB. Non-blocking: the UI already updated. */
async function postLog(mealId, entry){
 try {
  const q = API.map[mealId] || API.map['sat-l'];
  const menuItemId = (mealId && API.idByName[mealId]) ? API.idByName[mealId][entry.name] : null;
  const body = menuItemId
   ? { profileId: currentProfileId(), date: q.date, meal: q.meal, servings: 1, menuItemId }
   : { profileId: currentProfileId(), date: q.date, meal: q.meal, servings: 1, name: entry.name, calories: entry.k || 0, protein: entry.p || 0, carbs: entry.c || 0, fat: entry.f || 0 };
  const r = await fetch('/api/log', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (r.ok) console.log('[Hackro] logged to DB:', entry.name); else console.warn('[Hackro] /api/log rejected:', r.status);
 } catch (e) { /* offline / opened as a file: local log already stands */ }
}
render();
bootstrapRealData();
handleWhoopReturn();
</script>
